name: Build LocSpoof Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build React Web App
        run: |
          cd web
          npm ci
          npm run build
          cd ..
          mkdir -p android/app/src/main/assets/www
          cp -r web/dist/* android/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Copy APK to Web Public Directory
        run: |
          mkdir -p web/public
          cp android/app/build/outputs/apk/debug/app-debug.apk web/public/LocSpoof.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk LocSpoof-v2.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocSpoof-Android-APK
          path: LocSpoof-v2.0.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v2.0-latest
          name: "LocSpoof v2.0 Android APK"
          body: |
            ### 📱 LocSpoof Universal Android APK (v2.0)
            File APK siap di-install di HP Android Anda.
            
            #### Cara Pakai:
            1. Download file `LocSpoof.apk` di bawah.
            2. Buka **Pengaturan HP -> Opsi Pengembang -> Pilih aplikasi lokasi tiruan / mock location app** dan pilih **LocSpoof**.
            3. Buka LocSpoof di HP, pilih lokasi di peta, dan tap **TELEPORT**!
          files: |
            LocSpoof-v2.0.apk
            web/public/LocSpoof.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
