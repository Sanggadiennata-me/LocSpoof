name: Build LocSpoof Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build React Web App
        run: |
          cd web
          npm ci
          npm run build
          cd ..
          mkdir -p android/app/src/main/assets/www
          cp -r web/dist/* android/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Rename APK for Easy Download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk LocSpoof-v2.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocSpoof-Android-APK
          path: LocSpoof-v2.0.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v2.0-${{ github.sha }}
          name: "LocSpoof v2.0 Android APK"
          body: |
            ### 📱 LocSpoof Universal Android APK (v2.0)
            - **Murni di HP**: Tanpa laptop, tanpa kabel, tanpa aplikasi pihak ketiga (tanpa Termux/LADB/Shizuku).
            - **UI Flat Design**: Tampilan peta Google Maps interaktif bawaan.
            - **Sistem Lisensi Serverless**: Masukkan Master Key Anda untuk membuka akses.
            
            #### Cara Pakai:
            1. Download file `LocSpoof-v2.0.apk` di bawah dan install di HP Android Anda.
            2. Buka **Settings -> Developer Options -> Select mock location app** dan pilih **LocSpoof**.
            3. Buka LocSpoof, klik lokasi di peta, dan tap **Teleport**!
          files: LocSpoof-v2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
